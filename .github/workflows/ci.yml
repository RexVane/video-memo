name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile sources
        run: python -m compileall -q src tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check CLI version
        run: python src/pipeline.py --version
      - name: Build and install package metadata
        run: |
          python -m pip install --no-deps .
          videomemo --version

  plugin:
    name: Obsidian plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: obsidian-plugin/package-lock.json
      - name: Install plugin dependencies
        working-directory: obsidian-plugin
        run: npm ci
      - name: TypeScript check
        working-directory: obsidian-plugin
        run: npm run check
      - name: Build plugin
        working-directory: obsidian-plugin
        run: npm run build
      - name: Check generated bundle
        run: git diff --exit-code -- obsidian-plugin/main.js
