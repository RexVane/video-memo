name: Bug report
description: Report a reproducible problem in VideoMemo
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, browser cookies, private media, or Vault content.
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the input type, command or UI flow, and the observed result.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python, ffmpeg, Obsidian, and plugin versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove secrets, cookies, URLs with tokens, and personal paths.
